services:
  - type: web
    name: django-3d-artist-portfolio
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn portfolio_project.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
